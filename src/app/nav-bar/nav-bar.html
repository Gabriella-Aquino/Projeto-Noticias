<nav>
  <!-- DESKTOP -->
  <app-links class="desktop-only" [links]="categoryLinks()" />

  <!-- MOBILE -->
  <div class="mobile-only">
    <button id="menu-button" nz-button nzType="text" (click)="openMenu()">
      <span nz-icon nzType="menu"></span>
    </button>

    <nz-drawer
      [nzClosable]="true"
      [nzVisible]="visible()"
      nzPlacement="left"
      nzTitle="Categoria"
      (nzOnClose)="closeMenu()"
      [nzBodyStyle]="{ 'background-color': '#222', color: '#fff' }"
    >
      <ng-container *nzDrawerContent>
        <ul class="mobile-menu-list">
          @for (category of categoryLinks(); track category.href) {
            <li>
              <a [href]="category.href" (click)="closeMenu()">
                {{ category.label }}
              </a>
            </li>
          }
        </ul>
      </ng-container>
    </nz-drawer>
  </div>

  <div id="nav-actions">
    <app-search-bar />
    <div id="nav-buttons">
      @if (isLoggedIn()) {
        <a id="user-profile" routerLink="/admin" title="Ir para a área administrativa">
          <span id="user-name">{{ currentUser()?.name }}</span>
          <nz-tag [nzColor]="currentUser()?.role === 'admin' ? 'red' : 'blue'">
            {{ roleLabel() }}
          </nz-tag>
        </a>
        <app-button label="Sair" variant="link" icon="logout" (clicked)="logout()" />
      } @else {
        <app-button label="Entre" variant="link" icon="user" (clicked)="goToLogin()" />
      }
    </div>
  </div>
</nav>
