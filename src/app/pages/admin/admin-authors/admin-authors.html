<div class="admin-section">
  <div class="admin-section-header">
    <h1>Autores</h1>
    <button nz-button nzType="primary" (click)="openCreateModal()">
      <span nz-icon nzType="plus"></span>
      Novo autor
    </button>
  </div>

  <nz-table #authorTable [nzData]="authors()" [nzLoading]="loading()" nzNoResult="Nenhum autor cadastrado.">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Avatar</th>
        <th nzWidth="12rem">Ações</th>
      </tr>
    </thead>
    <tbody>
      @for (author of authorTable.data; track author.id) {
        <tr>
          <td>{{ author.name }}</td>
          <td>{{ author.avatar || '—' }}</td>
          <td>
            <button nz-button nzType="text" (click)="openEditModal(author)" aria-label="Editar autor">
              <span nz-icon nzType="edit"></span>
            </button>
            <button
              nz-button
              nzType="text"
              nzDanger
              nz-popconfirm
              nzPopconfirmTitle="Excluir este autor?"
              (nzOnConfirm)="remove(author)"
              aria-label="Excluir autor"
            >
              <span nz-icon nzType="delete"></span>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</div>

<nz-modal
  [(nzVisible)]="isModalVisible"
  [nzTitle]="editingAuthor() ? 'Editar autor' : 'Novo autor'"
  (nzOnCancel)="closeModal()"
  (nzOnOk)="submit()"
  nzOkText="Salvar"
  nzCancelText="Cancelar"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="form">
      <nz-form-item>
        <nz-form-label nzFor="name">Nome</nz-form-label>
        <nz-form-control
          [nzErrorTip]="
            form.controls.name.hasError('required')
              ? 'Informe o nome do autor.'
              : 'O nome deve ter pelo menos 2 caracteres.'
          "
        >
          <input nz-input id="name" formControlName="name" placeholder="Ex.: Maria Silva" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="avatar">Avatar (URL)</nz-form-label>
        <nz-form-control>
          <input nz-input id="avatar" formControlName="avatar" placeholder="https://..." />
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
