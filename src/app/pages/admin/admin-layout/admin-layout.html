<div class="admin-page">
  <div class="admin-topbar">
    <button
      type="button"
      class="admin-menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="admin-sidebar"
      aria-label="Abrir menu de administração"
    >
      <span nz-icon nzType="menu"></span>
    </button>
    <span class="admin-topbar__title">Administração</span>
  </div>

  @if (menuOpen()) {
    <div class="admin-backdrop" (click)="closeMenu()"></div>
  }

  <aside class="admin-sidebar" id="admin-sidebar" [class.admin-sidebar--open]="menuOpen()">
    <h2>Administração</h2>
    <p class="logged-as">
      Logado como <strong>{{ currentUser()?.name }}</strong>
    </p>

    <ul nz-menu nzMode="inline" class="admin-menu">
      <li nz-menu-item routerLink="/admin/news" routerLinkActive="ant-menu-item-selected" (click)="closeMenu()">
        <span nz-icon nzType="file-text"></span>
        Notícias
      </li>
      <li nz-menu-item routerLink="/admin/categories" routerLinkActive="ant-menu-item-selected" (click)="closeMenu()">
        <span nz-icon nzType="tags"></span>
        Categorias
      </li>
      <li nz-menu-item routerLink="/admin/authors" routerLinkActive="ant-menu-item-selected" (click)="closeMenu()">
        <span nz-icon nzType="user"></span>
        Autores
      </li>
      @if (isAdmin()) {
        <li nz-menu-item routerLink="/admin/users" routerLinkActive="ant-menu-item-selected" (click)="closeMenu()">
          <span nz-icon nzType="team"></span>
          Usuários
        </li>
      }
    </ul>
  </aside>

  <section class="admin-content">
    <router-outlet />
  </section>
</div>
