<div class="admin-page">
  <aside class="admin-sidebar">
    <h2>Administração</h2>
    <p class="logged-as">
      Logado como <strong>{{ currentUser()?.name }}</strong>
    </p>

    <ul nz-menu nzMode="inline" class="admin-menu">
      <li nz-menu-item routerLink="/admin/categories" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="tags"></span>
        Categorias
      </li>
      <li nz-menu-item routerLink="/admin/authors" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="user"></span>
        Autores
      </li>
      @if (isAdmin()) {
        <li nz-menu-item routerLink="/admin/users" routerLinkActive="ant-menu-item-selected">
          <span nz-icon nzType="team"></span>
          Usuários
        </li>
      }
    </ul>
  </aside>

  <section class="admin-content">
    <router-outlet />
  </section>
</div>
